
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#092f35">
<title>Чёрная треска — рыбный магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

:root {
  --deep: #082f35;
  --teal: #14535a;
  --accent: #d99a76;
  --muted: var(--tg-theme-hint-color, #87938f);
  --paper: var(--tg-theme-secondary-bg-color, #ffffff);
  --ink: var(--tg-theme-text-color, #173238);
  --shadow: 0 8px 24px rgba(0, 35, 40, 0.09);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 16px 15px 30px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--tg-theme-bg-color, #f4f6f3);
  color: var(--ink);
}

.app {
  max-width: 760px;
  margin: auto;
}

/* ШАПКА И ЛОГОТИП */

.header {
  position: relative;
  overflow: hidden;
  padding: 25px 22px;
  border-radius: 24px;
  background:
    radial-gradient(circle at 90% 10%, #27636a 0%, transparent 38%),
    linear-gradient(125deg, #062c32, #10474d);
  color: #ffffff;
  box-shadow: var(--shadow);
}

.header::after {
  content: "";
  position: absolute;
  width: 210px;
  height: 210px;
  right: -90px;
  bottom: -125px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 50%;
  box-shadow: 0 0 0 20px rgba(255,255,255,.035),
              0 0 0 42px rgba(255,255,255,.025);
  pointer-events: none;
}

.brand {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 18px;
}

.brand-logo {
  display: block;
  width: 125px;
  max-height: 125px;
  object-fit: contain;
  flex-shrink: 0;
}

.brand-text {
  min-width: 0;
}

.brand-text h1 {
  margin: 0 0 10px;
  color: #ffffff;
  font-family: Georgia, serif;
  font-size: clamp(23px, 6vw, 31px);
  line-height: 1.1;
}

.brand-text p {
  margin: 0;
  color: #e5efeb;
  font-size: 13px;
  line-height: 1.5;
}

/* ЗАГОЛОВОК КАТАЛОГА */

.section-head {
  margin: 27px 1px 15px;
}

.section-head h2 {
  margin: 0;
  color: var(--ink);
  font-size: 23px;
  letter-spacing: -.035em;
}

.section-head p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
}

/* ФИЛЬТРЫ */

.filters {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 2px 1px 13px;
  margin: 0 -1px 7px;
  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  flex: 0 0 auto;
  border: 1px solid var(--tg-theme-hint-color, #dce4e0);
  border-radius: 999px;
  padding: 11px 15px;
  background: var(--paper);
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.filter.active {
  color: #ffffff;
  background: var(--deep);
  border-color: var(--deep);
  box-shadow: 0 5px 14px rgba(8,47,53,.2);
}

/* КАРТОЧКИ ТОВАРОВ */

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.card {
  min-width: 0;
  overflow: hidden;
  border-radius: 19px;
  background: var(--paper);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}

.photo-wrap {
  position: relative;
  overflow: hidden;
  background: #e9e2d8;
}

.photo {
  display: block;
  width: 100%;
  height: 155px;
  object-fit: cover;
}

.category-tag {
  position: absolute;
  left: 10px;
  top: 10px;
  max-width: calc(100% - 20px);
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,.94);
  color: #10474d;
  font-size: 10px;
  font-weight: 700;
}

.info {
  padding: 13px;
  display: flex;
  flex: 1;
  flex-direction: column;
}

.info h3 {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.3;
}

.description {
  margin: 0 0 13px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.48;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.price {
  margin-top: auto;
  color: var(--tg-theme-link-color, #14665b);
  font-size: 17px;
  font-weight: 800;
}

.origin {
  margin-top: 7px;
  color: var(--muted);
  font-size: 11px;
}

/* МАГАЗИНЫ */

.stores {
  margin-top: 30px;
  padding: 21px;
  border-radius: 21px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.stores-top {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 7px;
}

.pin {
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(20,83,90,.1);
  font-size: 17px;
}

.stores h2 {
  margin: 0;
  color: var(--ink);
  font-size: 20px;
}

.stores p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.store-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 15px;
  padding: 13px 14px;
  border-radius: 14px;
  text-decoration: none;
  color: var(--ink);
  background: var(--tg-theme-bg-color, #f1f4f1);
  font-size: 13px;
  font-weight: 700;
}

.store-note {
  margin-top: 12px !important;
  font-size: 11px !important;
}

footer {
  padding: 24px 0 5px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
}

.status {
  grid-column: 1 / -1;
  padding: 28px 12px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* АДАПТАЦИЯ */

@media (min-width: 600px) {
  body {
    padding: 24px;
  }

  .header {
    padding: 32px;
  }

  .brand-logo {
    width: 150px;
    max-height: 150px;
  }

  .photo {
    height: 210px;
  }

  .info {
    padding: 17px;
  }

  .info h3 {
    font-size: 17px;
  }

  .description {
    font-size: 13px;
  }

  .products {
    gap: 18px;
  }
}

@media (max-width: 390px) {
  body {
    padding: 10px;
  }

  .header {
    padding: 20px 16px;
  }

  .brand {
    gap: 12px;
  }

  .brand-logo {
    width: 100px;
    max-height: 110px;
  }

  .brand-text h1 {
    font-size: 23px;
  }

  .photo {
    height: 125px;
  }

  .info {
    padding: 10px;
  }

  .info h3 {
    font-size: 13px;
  }

  .price {
    font-size: 15px;
  }
}

</style>
</head>
<body>
<main class="app">
<section aria-labelledby="catalog-title">
<div class="section-head"><h2 id="catalog-title">Наш ассортимент</h2><p>Выбирайте деликатесы к своему столу</p></div>
<nav class="filters" id="filters" aria-label="Категории товаров"></nav>
<div class="products" id="products"><div class="status">Загружаем ассортимент…</div></div>
</section>
<section class="stores" aria-labelledby="stores-title">
<div class="stores-top"><div class="pin">📍</div><h2 id="stores-title">Наши магазины</h2></div>
<p>Выберите удобный магазин — откроем его расположение на карте.</p>
<div class="store-link"><span>Адреса магазинов скоро появятся</span><span>⌖</span></div>
<p class="store-note">Добавим реальные адреса и ссылки на карты после уточнения.</p>
</section>
<footer>Чёрная треска · Рыба и морепродукты</footer>
</main>
<script>
const productsContainer=document.getElementById("products");
const filtersContainer=document.getElementById("filters");
let products=[];
const categoryIcons={"Морепродукты":"🦐","Копчёная рыба":"♨","Слабосолёная рыба":"🐟","Икра и деликатесы":"🟠"};
function formatPrice(product){
 const amount=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2}).format(product.price);
 return `${amount} ₽ / ${product.unit}`;
}
function createFilters(){
 const categories=["Все",...new Set(products.map(p=>p.category))];
 filtersContainer.innerHTML="";
 categories.forEach(category=>{
  const button=document.createElement("button");button.type="button";
  button.className="filter"+(category==="Все"?" active":"");
  button.textContent=category==="Все"?"Все":`${categoryIcons[category]||"•"}  ${category}`;
  button.addEventListener("click",()=>{
   filtersContainer.querySelectorAll(".filter").forEach(btn=>btn.classList.remove("active"));
   button.classList.add("active");showProducts(category);
  });
  filtersContainer.appendChild(button);
 });
}
function showProducts(category="Все"){
 const filtered=products.filter(p=>category==="Все"||p.category===category);
 productsContainer.innerHTML="";
 if(!filtered.length){productsContainer.innerHTML='<div class="status">В этой категории пока нет товаров.</div>';return;}
 filtered.forEach(product=>{
  const card=document.createElement("article");card.className="card";
  const photoWrap=document.createElement("div");photoWrap.className="photo-wrap";
  const image=document.createElement("img");image.className="photo";image.src=product.image;image.alt=product.name;image.loading="lazy";
  image.onerror=()=>{image.style.display="none";};
  const tag=document.createElement("span");tag.className="category-tag";tag.textContent=product.category;
  photoWrap.append(image,tag);
  const info=document.createElement("div");info.className="info";
  const name=document.createElement("h3");name.textContent=product.name;
  const description=document.createElement("p");description.className="description";description.textContent=product.description;
  const price=document.createElement("div");price.className="price";price.textContent=formatPrice(product);
  info.append(name,description,price);
  if(product.origin){const origin=document.createElement("div");origin.className="origin";origin.textContent="📍 "+product.origin;info.appendChild(origin);}
  card.append(photoWrap,info);productsContainer.appendChild(card);
 });
}
async function loadProducts(){
 try{
  const response=await fetch("./products.json");if(!response.ok)throw new Error("Не удалось загрузить каталог");
  products=await response.json();createFilters();showProducts();
 }catch(error){
  productsContainer.innerHTML='<div class="status">Не удалось загрузить ассортимент. Проверьте products.json и обновите страницу.</div>';
  console.error(error);
 }
}
loadProducts();
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
</script>
</body>
</html>
