<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174d3b">
  <title>Рыбный магазин</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px 10px 30px;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f5f7f5);
      color: var(--tg-theme-text-color, #17251f);
    }

    .header {
      padding: 22px 18px;
      border-radius: 20px;
      background: #174d3b;
      color: white;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 25px;
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      opacity: 0.85;
      font-size: 14px;
      line-height: 1.5;
    }

    h2 {
      font-size: 20px;
      margin: 20px 0 14px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .filter {
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      white-space: nowrap;
      background: #e5eee9;
      color: #174d3b;
      font-weight: bold;
      cursor: pointer;
    }

    .filter.active {
      background: #174d3b;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      overflow: hidden;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color, white);
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .photo {
      height: 130px;
      background: #e7f0eb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo .placeholder {
      font-size: 54px;
    }

    .info {
      padding: 12px;
    }

    .info h3 {
      font-size: 15px;
      margin: 0 0 6px;
      line-height: 1.3;
    }

    .category {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #84918b);
      margin-bottom: 8px;
    }

    .description {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .price {
      color: #087a55;
      font-weight: bold;
      font-size: 14px;
    }

    .origin {
      margin-top: 7px;
      font-size: 12px;
      color: var(--tg-theme-hint-color, #84918b);
    }

    .message {
      text-align: center;
      padding: 30px 15px;
      color: var(--tg-theme-hint-color, #84918b);
    }

    @media (max-width: 350px) {
      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>🐟 Рыбный магазин</h1>
    <p>Свежая рыба и морепродукты. Выбирайте то, что любите!</p>
  </header>

  <h2>Наш ассортимент</h2>

  <div class="filters" id="filters"></div>

  <div class="products" id="products">
    <div class="message">Загружаем ассортимент...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const productsContainer = document.getElementById("products");
    const filtersContainer = document.getElementById("filters");

    let products = [];
    let activeCategory = "all";

    function formatPrice(product) {
      const price = new Intl.NumberFormat("ru-RU", {
        maximumFractionDigits: 2
      }).format(product.price);

      return `${price} ${product.currency} / ${product.unit}`;
    }

    function showProducts(category) {
      activeCategory = category;

      const filtered = category === "all"
        ? products
        : products.filter(p => p.category === category);

      if (filtered.length === 0) {
        productsContainer.innerHTML =
          '<div class="message">В этой категории пока нет товаров</div>';
        return;
      }

      productsContainer.innerHTML = filtered.map(product => `
        <article class="card">
          <div class="photo">
            <img
              src="./${product.image}"
              alt="${product.name}"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            >
            <div class="placeholder" style="display:none">🐟</div>
          </div>

          <div class="info">
            <h3>${product.name}</h3>
            <div class="category">${product.category}</div>
            <div class="description">${product.description || ""}</div>
            <div class="price">${formatPrice(product)}</div>
            ${product.origin
              ? `<div class="origin">Происхождение: ${product.origin}</div>`
              : ""}
          </div>
        </article>
      `).join("");
    }

    function createFilters() {
      const categories = [...new Set(products.map(p => p.category))];

      const buttons = [
        { name: "Все", value: "all" },
        ...categories.map(category => ({
          name: category,
          value: category
        }))
      ];

      filtersContainer.innerHTML = buttons.map(item => `
        <button
          class="filter ${item.value === "all" ? "active" : ""}"
          data-category="${item.value}"
        >${item.name}</button>
      `).join("");

      filtersContainer.querySelectorAll(".filter").forEach(button => {
        button.addEventListener("click", () => {
          filtersContainer.querySelectorAll(".filter").forEach(item => {
            item.classList.remove("active");
          });

          button.classList.add("active");
          showProducts(button.dataset.category);
        });
      });
    }

    async function loadProducts() {
      try {
        const response = await fetch("./products.json");

        if (!response.ok) {
          throw new Error("Не удалось загрузить products.json");
        }

        products = await response.json();

        createFilters();
        showProducts("all");

      } catch (error) {
        console.error(error);
        productsContainer.innerHTML =
          '<div class="message">Не удалось загрузить каталог. Попробуйте позже.</div>';
      }
    }

    loadProducts();
  </script>

</body>
</html>
